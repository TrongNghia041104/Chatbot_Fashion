services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: fashion_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Docker Qdrant server storage. Do not mount qdrant_data_65k directly;
      # migrate it into this server with scripts/migrate_qdrant_local_to_server.py.
      - ./storage/qdrant:/qdrant/storage
    restart: always

  redis:
    image: redis/redis-stack:latest
    container_name: fashion_redis_stack
    ports:
      - "6379:6379"   # Redis database
      - "8001:8001"   # RedisInsight web UI
    volumes:
      - ./storage/redis:/data
    restart: always
